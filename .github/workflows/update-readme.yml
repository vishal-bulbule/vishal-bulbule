name: Update README with latest content

on:
  schedule:
    # Runs every day at 00:30 UTC (06:00 IST)
    - cron: "30 0 * * *"
  workflow_dispatch: # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Renders latest YouTube videos as thumbnail cards in the YOUTUBE-CARDS block
      - name: Update with latest YouTube video cards
        uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: UCMNZFAhQSB314E_MG3IbTXQ
          max_videos: 6
          card_width: 250
          background_color: "#0A1F44"
          title_color: "#F2F3F8"
          stats_color: "#94A3B8"

      # Pulls latest 4 Medium articles into the BLOG-POST-LIST block
      - name: Update with latest Medium posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "BLOG-POST-LIST"
          commit_message: "Update latest blog posts"
          feed_list: "https://medium.com/feed/@vishalbulbule"
          max_post_count: 4
          template: "- ✍️ [$title]($url) — $date $newline"
          date_format: "mmm d, yyyy"
